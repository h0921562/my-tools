# AIタスク用: Issue / PR のコメントで @claude と書くと Claude Code が作業します。
# 必要なシークレット（どちらか一方）:
#   CLAUDE_CODE_OAUTH_TOKEN … Claudeのサブスクで使う場合（PCで `claude setup-token` を実行して取得）
#   ANTHROPIC_API_KEY       … APIキーで使う場合
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # AIタスクで選んだモデル（本文末尾の <!-- ai-model: ... -->）があれば --model で渡す
      - name: Pick model
        id: opt
        env:
          TEXT: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
        run: |
          m=$(printf '%s' "$TEXT" | grep -oE '<!-- ai-model: [A-Za-z0-9._:-]{1,64} -->' | tail -1 | sed -E 's/<!-- ai-model: (.*) -->/\1/' || true)
          echo "args=${m:+--model $m}" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: ${{ steps.opt.outputs.args }}
